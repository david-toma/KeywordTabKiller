name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project KeywordTabKiller.xcodeproj \
            -scheme KeywordBlocker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | tail -n 40

      - name: Pseudo-sign entitlements (so AltStore sees the App Group)
        run: |
          APP="build/Build/Products/Release-iphoneos/KeywordBlocker.app"
          ldid -SExtension/KeywordBlockerExtension.entitlements "$APP/PlugIns/KeywordBlockerExtension.appex/KeywordBlockerExtension"
          ldid -SApp/KeywordBlocker.entitlements "$APP/KeywordBlocker"

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/KeywordBlocker.app"
          rm -rf Payload KeywordBlocker.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KeywordBlocker.ipa Payload
          unzip -l KeywordBlocker.ipa | head -n 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeywordBlocker-ipa
          path: KeywordBlocker.ipa

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KeywordBlocker.ipa
